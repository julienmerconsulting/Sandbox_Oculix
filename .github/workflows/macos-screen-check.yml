name: macOS screen check

on:
  workflow_dispatch:

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Download the OculiX IDE jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download splash-test -R ${{ github.repository }} -p 'oculixide-4.0.0-complete-mac.jar'

      - name: Architecture and display
        run: |
          uname -m
          system_profiler SPDisplaysDataType

      - name: Write the two scripts
        run: |
          mkdir make_images.sikuli screen_check.sikuli
          cat > make_images.sikuli/make_images.py <<'EOF'
          from java.awt import Color, Font, RenderingHints
          from java.awt.image import BufferedImage
          from java.io import File
          from java.lang import System
          from javax.imageio import ImageIO

          work = System.getenv("GITHUB_WORKSPACE")
          w, h = 1000, 500
          img = BufferedImage(w, h, BufferedImage.TYPE_INT_RGB)
          g = img.createGraphics()
          g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
          g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
          g.setColor(Color.WHITE)
          g.fillRect(0, 0, w, h)
          g.setColor(Color.BLACK)
          g.setFont(Font("SansSerif", Font.BOLD, 56))
          g.drawString("OculiX sees this Mac", 60, 120)
          g.setColor(Color(30, 144, 255))
          g.fillRoundRect(380, 220, 240, 140, 30, 30)
          g.setColor(Color(255, 140, 0))
          g.fillOval(400, 245, 90, 90)
          g.setColor(Color.WHITE)
          g.setFont(Font("SansSerif", Font.BOLD, 40))
          g.drawString("GO", 510, 305)
          g.dispose()

          ImageIO.write(img, "png", File(work + "/card.png"))
          ImageIO.write(img.getSubimage(370, 210, 260, 160), "png", File(work + "/target.png"))
          print("IMAGES READY")
          EOF
          cat > screen_check.sikuli/screen_check.py <<'EOF'
          from java.lang import System
          from org.sikuli.script import Pattern, Screen

          work = System.getenv("GITHUB_WORKSPACE")
          s = Screen()
          print("SCREEN: " + str(s))

          m = s.wait(Pattern(work + "/target.png").similar(0.8), 15)
          print("FIND TARGET: score %.3f, %s" % (m.getScore(), m))

          t = s.waitText("OculiX", 15)
          print("FIND TEXT: " + str(t))

          m.click()
          print("CLICK DONE at " + str(m.getTarget()))
          print("SCREEN CHECK OK")
          EOF

      - name: Render the card and the image to look for
        run: |
          java -jar oculixide-4.0.0-complete-mac.jar -r make_images.sikuli > make.log 2>&1 || true
          cat make.log
          ls -l card.png target.png

      - name: Open the card in Preview, as a user would
        run: |
          open -a Preview card.png
          sleep 6
          screencapture -x before.png

      - name: Find the image, read the text, click, on the real screen
        run: |
          java -jar oculixide-4.0.0-complete-mac.jar -d 3 -r screen_check.sikuli > screen.log 2>&1 || true
          screencapture -x after.png

      - name: Log
        if: always()
        run: |
          cat screen.log

      - name: Every step must have passed
        run: |
          grep -q "SCREEN CHECK OK" screen.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.os }}
          path: |
            make.log
            screen.log
            card.png
            target.png
            before.png
            after.png
