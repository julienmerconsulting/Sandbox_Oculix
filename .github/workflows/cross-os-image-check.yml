name: cross-OS image check

# The same dialog captured on Windows (Paint and Chrome, screen at 125 %) and searched on macOS:
# the PNG shown in Preview, the HTML drawn by Chrome. One RESULT line per capture: score, size found,
# so the scale the cascade used. A measure, not a gate: the job stays green on NOT FOUND.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

jobs:
  check:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Join the tailnet as runner-mac
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: runner-mac

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Stream the screen as MJPEG, on the tailnet address only
        run: |
          TSIP=$(tailscale ip -4 | head -1)
          echo "tailnet address: $TSIP"
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" > devices.txt 2>&1 || true
          cat devices.txt
          IDX=$(grep -o '\[[0-9]*\] Capture screen 0' devices.txt | grep -o '[0-9]*' | head -1)
          echo "screen device index: $IDX"
          VF="scale=960:-2"
          if ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext; then
            VF="scale=960:-2,drawtext=fontfile=/System/Library/Fonts/Supplemental/Arial.ttf:text='%{localtime\:%T}':fontsize=28:fontcolor=yellow:box=1:boxcolor=black@0.6:x=10:y=10"
            echo "runner clock drawn in the top left corner, Paris time"
          else
            echo "this ffmpeg has no drawtext: no clock in the image"
          fi
          export VF
          nohup bash -c "while true; do TZ=Europe/Paris ffmpeg -hide_banner -loglevel warning -fflags nobuffer -flags low_delay -f avfoundation -framerate 30 -capture_cursor 1 -i '${IDX}:none' -vf \"\$VF\" -r 5 -c:v mjpeg -q:v 8 -f mpjpeg -content_type 'multipart/x-mixed-replace;boundary=ffmpeg' -listen 1 http://${TSIP}:8080/live; sleep 1; done" > ffmpeg.log 2>&1 &
          sleep 3
          echo "Open http://${TSIP}:8080/live in the browser"

      - name: Time to open the stream
        run: |
          sleep 90

      - name: Download the OculiX IDE jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cross-os-test -R ${{ github.repository }} -p 'oculixide-5.0.0-complete-mac.jar'

      - name: Lift the quarantine Homebrew left on Chrome, so Gatekeeper does not ask
        run: |
          sudo xattr -dr com.apple.quarantine "/Applications/Google Chrome.app"

      - name: Architecture and display
        run: |
          uname -m
          system_profiler SPDisplaysDataType

      - name: Write the search script
        run: |
          mkdir probe.sikuli
          cat > probe.sikuli/probe.py <<'EOF'
          import os, sys, time
          from java.io import File
          from javax.imageio import ImageIO
          from org.sikuli.script import App, Pattern, Screen

          folder = os.environ["GITHUB_WORKSPACE"] + "/cross-os/"
          for name in os.environ.get("CLOSE_APPS", "").split(","):
              if name:
                  print("CLOSE %s: %s" % (name, App.close(name)))
          browser = os.environ.get("BROWSER")
          page = "http://127.0.0.1:8000/cross-os.html"
          if browser == "chrome":
              app = App("Google Chrome").setArguments(
                  ["--no-first-run", "--no-default-browser-check", "--use-mock-keychain",
                   "--password-store=basic", page])
          elif browser == "safari":
              app = App("Safari").setArguments([page])
          if browser:
              print("OPEN %s: %s" % (browser, app.open(10)))
              time.sleep(8)
          s = Screen()
          print("SCREEN: %s" % s)
          for name in sys.argv[1:]:
              path = folder + name + ".png"
              img = ImageIO.read(File(path))
              w, h = img.getWidth(), img.getHeight()
              start = time.time()
              m = s.exists(Pattern(path).similar(0.9), 5)
              ms = int((time.time() - start) * 1000)
              if m is None:
                  print("RESULT %s %dx%d: NOT FOUND (%d ms)" % (name, w, h, ms))
              else:
                  print("RESULT %s %dx%d: score %.3f, found %dx%d, scale %.2f, at %d,%d (%d ms)"
                        % (name, w, h, m.getScore(), m.w, m.h, m.w / float(w), m.x, m.y, ms))
          EOF

      - name: Serve the page over http, Safari refuses a file:// URL from outside
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory cross-os > http.log 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:8000/cross-os.html | head -1

      - name: The PNG in Preview, search the Paint captures
        run: |
          open -a Preview cross-os/cross-os.png
          sleep 6
          caffeinate -u -t 2
          java -jar oculixide-5.0.0-complete-mac.jar -r probe.sikuli --args PaintApp PaintText > preview.log 2>&1 || true
          grep -E "SCREEN|RESULT" preview.log || cat preview.log
          screencapture -x preview.png

      - name: The HTML in Chrome, search the Chrome captures
        run: |
          caffeinate -u -t 2
          CLOSE_APPS=Preview BROWSER=chrome java -jar oculixide-5.0.0-complete-mac.jar -r probe.sikuli --args ChromeApp ChromeText > chrome.log 2>&1 || true
          grep -E "CLOSE|OPEN|SCREEN|RESULT" chrome.log || cat chrome.log
          screencapture -x chrome.png

      - name: The HTML in Safari, search the Chrome captures
        run: |
          caffeinate -u -t 2
          CLOSE_APPS="Google Chrome" BROWSER=safari java -jar oculixide-5.0.0-complete-mac.jar -r probe.sikuli --args ChromeApp ChromeText > safari.log 2>&1 || true
          grep -E "CLOSE|OPEN|SCREEN|RESULT" safari.log || cat safari.log
          screencapture -x safari.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-os-${{ inputs.os }}
          path: |
            preview.png
            chrome.png
            safari.png
