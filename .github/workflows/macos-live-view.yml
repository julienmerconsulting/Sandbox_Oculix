name: macOS live view

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
      wait_before:
        description: Seconds to wait before the check, time to open the stream
        default: '90'
      watch_minutes:
        description: Minutes to keep the runner alive after the check
        default: '10'

jobs:
  live:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Join the tailnet as runner-mac
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: runner-mac

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Stream the screen as MJPEG, on the tailnet address only
        run: |
          TSIP=$(tailscale ip -4 | head -1)
          echo "tailnet address: $TSIP"
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" > devices.txt 2>&1 || true
          cat devices.txt
          IDX=$(grep -o '\[[0-9]*\] Capture screen 0' devices.txt | grep -o '[0-9]*' | head -1)
          echo "screen device index: $IDX"
          nohup bash -c "while true; do ffmpeg -hide_banner -loglevel warning -f avfoundation -framerate 30 -capture_cursor 1 -i '${IDX}:none' -vf scale=1280:-2 -r 15 -c:v mjpeg -q:v 6 -f mpjpeg -content_type 'multipart/x-mixed-replace;boundary=ffmpeg' -listen 1 http://${TSIP}:8080/live; sleep 1; done" > ffmpeg.log 2>&1 &
          sleep 3
          echo "Open http://runner-mac:8080/live in your browser"

      - name: Time to open the stream
        run: |
          sleep ${{ inputs.wait_before }}

      - name: Download the OculiX IDE jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download splash-test -R ${{ github.repository }} -p 'oculixide-4.0.0-complete-mac.jar'

      - name: Write the two scripts
        run: |
          mkdir make_images.sikuli screen_check.sikuli
          cat > make_images.sikuli/make_images.py <<'EOF'
          from java.awt import Color, Font, RenderingHints
          from java.awt.image import BufferedImage
          from java.io import File
          from java.lang import System
          from javax.imageio import ImageIO

          work = System.getenv("GITHUB_WORKSPACE")
          w, h = 1000, 500
          img = BufferedImage(w, h, BufferedImage.TYPE_INT_RGB)
          g = img.createGraphics()
          g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
          g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
          g.setColor(Color.WHITE)
          g.fillRect(0, 0, w, h)
          g.setColor(Color.BLACK)
          g.setFont(Font("SansSerif", Font.BOLD, 56))
          g.drawString("OculiX sees this Mac", 60, 120)
          g.setColor(Color(30, 144, 255))
          g.fillRoundRect(380, 220, 240, 140, 30, 30)
          g.setColor(Color(255, 140, 0))
          g.fillOval(400, 245, 90, 90)
          g.setColor(Color.WHITE)
          g.setFont(Font("SansSerif", Font.BOLD, 40))
          g.drawString("GO", 510, 305)
          g.dispose()

          ImageIO.write(img, "png", File(work + "/card.png"))
          ImageIO.write(img.getSubimage(370, 210, 260, 160), "png", File(work + "/target.png"))
          print("IMAGES READY")
          EOF
          cat > screen_check.sikuli/screen_check.py <<'EOF'
          from java.awt import SplashScreen, Window
          from java.lang import System
          from org.sikuli.script import Pattern, Screen

          splash = SplashScreen.getSplashScreen()
          if splash is not None:
              splash.close()
              print("NATIVE SPLASH CLOSED")
          for win in Window.getWindows():
              if win.isShowing():
                  print("CLOSING WINDOW: " + win.getClass().getName())
                  win.dispose()

          work = System.getenv("GITHUB_WORKSPACE")
          s = Screen()
          print("SCREEN: " + str(s))

          m = s.wait(Pattern(work + "/target.png").similar(0.8), 15)
          print("FIND TARGET: score %.3f, %s" % (m.getScore(), m))
          m.highlight(2)

          t = s.waitText("OculiX", 15)
          print("FIND TEXT: " + str(t))
          t.highlight(2)

          m.click()
          print("CLICK DONE at " + str(m.getTarget()))
          print("SCREEN CHECK OK")
          EOF

      - name: Render the card and open it in Preview
        run: |
          java -jar oculixide-4.0.0-complete-mac.jar -r make_images.sikuli > make.log 2>&1 || true
          cat make.log
          open -a Preview card.png
          sleep 6

      - name: Find the image, read the text, click, live
        run: |
          java -jar oculixide-4.0.0-complete-mac.jar -d 3 -r screen_check.sikuli > screen.log 2>&1 || true
          cat screen.log

      - name: Keep the runner alive to watch
        run: |
          sleep $(( ${{ inputs.watch_minutes }} * 60 ))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ inputs.os }}
          path: |
            devices.txt
            ffmpeg.log
            make.log
            screen.log
